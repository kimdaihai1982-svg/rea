server {
    listen 8080;
    server_name _;
    root /var/www/projects/demo/public;
    index index.php index.html;
    server_tokens off;
    client_max_body_size 32m;
    # Retain the base image's FPM healthcheck without exposing it publicly.
    location = /fpm-ping {
        allow 127.0.0.1;
        deny all;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php-fpm.sock;
    }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php-fpm.sock;
    }
    location ~ /\. { deny all; }
}
